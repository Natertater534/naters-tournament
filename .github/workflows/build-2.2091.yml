name: GD 2.2091 (Geode v6)

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gd2.2091-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-common.yml
    with:
      geode: "6.0.0"
      gd: "2.2091"
      label: "2.2091"

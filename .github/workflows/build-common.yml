# Shared build for one Geode / GD version. Called by build-2.2091.yml and build-2.2081.yml
# (one run per version, so the per-platform artifact names never collide).
name: Build (shared)

on:
  workflow_call:
    inputs:
      geode:
        type: string
        required: true
      gd:
        type: string
        required: true
      label:
        type: string
        required: true
      bindings-ref:
        type: string
        default: ""
      configure-args:
        type: string
        default: ""
      zstd:
        type: boolean
        default: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: Windows, os: windows-latest, target: Win64 }
          - { name: Android64, os: ubuntu-latest, target: Android64 }
          - { name: Android32, os: ubuntu-latest, target: Android32 }
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Target Geode ${{ inputs.geode }} and GD ${{ inputs.gd }}
        shell: bash
        env:
          GEODE_V: ${{ inputs.geode }}
          GD_V: ${{ inputs.gd }}
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('mod.json','utf8'));m.geode=process.env.GEODE_V;m.gd={win:process.env.GD_V,android:process.env.GD_V};fs.writeFileSync('mod.json',JSON.stringify(m,null,2)+'\n')"
          cat mod.json

      # The action upgrades LLVM through Chocolatey, whose feed sometimes times out; the
      # runner's own Clang is then too old for its MSVC headers. Install it straight from
      # the LLVM releases first when that's the case.
      - name: Make sure Clang is new enough (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $have = 0
          $line = (& clang --version 2>$null | Select-Object -First 1)
          if ($line -match 'version (\d+)') { $have = [int]$Matches[1] }
          Write-Output "Clang on the runner: $have"
          if ($have -lt 22) {
            curl.exe -L --retry 5 --retry-delay 10 --fail -o llvm.msi "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/LLVM-23.1.3-win64.msi"
            Start-Process msiexec.exe -Wait -ArgumentList '/i', "$PWD\llvm.msi", '/qn', '/norestart'
            & "C:\Program Files\LLVM\bin\clang.exe" --version
          }

      - name: Build
        uses: geode-sdk/build-geode-mod@dce36b35e1c3d9d8af92347760b12eba3caf4004
        with:
          combine: true
          cli: v4.0.2
          target: ${{ matrix.config.target }}
          bindings-ref: ${{ inputs.bindings-ref }}
          configure-args: ${{ inputs.configure-args }}

      # On failure, rebuild with keep-going so one log holds every compile error,
      # and push it to a ci-logs/* branch (readable without Actions log access).
      - name: Save every compile error
        if: failure()
        shell: bash
        run: |
          if [ -f build/build.ninja ]; then
            cmake --build build --config Release -- -k 0 > build.log 2>&1 || true
          else
            echo "No build/build.ninja: configuring failed, see the Build step." > build.log
          fi
          tail -c 800000 build.log > build-tail.log
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          blob=$(git hash-object -w build-tail.log)
          tree=$(printf '100644 blob %s\tbuild.log\n' "$blob" | git mktree)
          commit=$(echo "log $GITHUB_RUN_ID $GITHUB_SHA" | git commit-tree "$tree")
          git push -f origin "$commit:refs/heads/ci-logs/${{ inputs.label }}-${{ matrix.config.name }}"

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - name: Combine the platforms
        id: combine
        uses: geode-sdk/build-geode-mod/combine@dce36b35e1c3d9d8af92347760b12eba3caf4004
        with:
          cli: v4.0.2
          zstd: ${{ inputs.zstd }}

      - name: Collect
        shell: bash
        run: |
          mkdir dist
          cp "${{ steps.combine.outputs.build-output }}"/*.geode dist/
          ls -la dist

      - uses: actions/upload-artifact@v5
        with:
          name: naters-tournament-gd${{ inputs.gd }}
          path: dist/*.geode

      - name: Publish (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GD_V: ${{ inputs.gd }}
          GEODE_V: ${{ inputs.geode }}
          LABEL: ${{ inputs.label }}
        run: |
          set -euo pipefail
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          file=$(ls dist/*.geode | head -n 1)
          # builds/<label>: a one-commit branch holding just the latest build
          blob=$(git hash-object -w "$file")
          tree=$(printf '100644 blob %s\tnater.tournament.geode\n' "$blob" | git mktree)
          commit=$(echo "build ${GITHUB_SHA::7} for GD $GD_V (Geode $GEODE_V)" | git commit-tree "$tree")
          git push -f origin "$commit:refs/heads/builds/$LABEL"
          # rolling pre-release for players
          tag="latest-$LABEL"
          cp "$file" "dist/naters-tournament-gd$GD_V.geode"
          git tag -f "$tag" "$GITHUB_SHA"
          git push -f origin "refs/tags/$tag"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --prerelease --title "Nater's Tournament for GD $GD_V" \
              --notes "Latest build for Geometry Dash $GD_V with Geode $GEODE_V. Put the .geode file in your Geode mods folder and restart the game."
          fi
          gh release upload "$tag" "dist/naters-tournament-gd$GD_V.geode" --clobber
